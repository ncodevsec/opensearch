<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Search Hub</title>
	<link rel="icon" type="image/x-icon" href="favicon.ico" />
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="style.css" />
</head>

<body class="bg-slate-100 text-slate-900 antialiased">
	<main class="mx-auto max-w-6xl px-3 py-4 sm:px-4 lg:px-6">
		<header
			class="lg:bg-opacity-10 lg:backdrop-blur-md lg:scale-105 lg:sticky lg:top-3 lg:z-50 mb-5 flex flex-col gap-3 px-4 py-5 sm:px-5 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-md md:flex-row md:items-center md:justify-between">
			<div class="flex w-full flex-row flex-wrap items-center justify-between gap-3">
				<div class="min-w-0">
					<h1 class="text-xl font-semibold text-slate-900">Search Hub</h1>
					<p class="text-xs text-slate-500 uppercase tracking-wide mt-2">Keep productive · Search anything</p>
				</div>
				<div class="flex items-center gap-2 md:w-auto md:justify-end">
					<button id="layout-toggle-btn"
						class="settings-button flex-shrink-0 text-slate-500 hover:text-slate-900 transition-colors"
						title="Toggle layout view">
						<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
							<rect x="4" y="4" width="6" height="6" rx="1.5" />
							<rect x="14" y="4" width="6" height="6" rx="1.5" />
							<rect x="4" y="14" width="6" height="6" rx="1.5" />
							<rect x="14" y="14" width="6" height="6" rx="1.5" />
						</svg>
					</button>
					<button id="settings-btn"
						class="settings-button flex-shrink-0 text-slate-500 hover:text-slate-900 transition-colors"
						title="Settings">
						<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
							</path>
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
						</svg>
					</button>
				</div>
			</div>
			<div class="flex w-full justify-center md:w-auto md:justify-end">
				<div class="text-end md:min-w-[120px] mt-4 md:mt-0">
					<p id="digital-clock" class="text-2xl font-semibold tracking-tight text-slate-900">00:00 PM</p>
					<p id="clock-description" class="mt-1 text-xs uppercase tracking-[0.24em] text-slate-500">Fri • Aug
						7</p>
				</div>
			</div>
		</header>

		<!-- Main search with clock and todo widgets -->
		<div class="mb-4 grid grid-cols-1 gap-4 md:grid-cols-[minmax(0,1fr)_300px] items-start">
			<div id="main-panel" class="min-w-0">
				<div id="global-search" class="mb-4">
					<div class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
						<div class="px-4 py-4 sm:px-5">
							<label for="global-search-input" class="sr-only">Search input</label>
							<div class="search-input-wrapper relative">
								<input id="global-search-input" type="search"
									placeholder="Search anything fast, then choose a service"
									class="w-full min-w-0 rounded-full border-4 border-gray-300 pl-4 pr-16 py-3 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none"
									autofocus />
								<button id="default-service-indicator" type="button"
									class="default-service-indicator absolute right-3 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full transition hover:bg-slate-100 hover:scale-110"
									title="Default search engine" aria-label="Default search engine">
									<img id="default-service-icon" class="h-5 w-5 object-contain"
										alt="Default search engine icon" />
								</button>
							</div>
							<div id="favorite-services" class="mt-3 flex flex-wrap gap-2 justify-center"></div>
							<hr class="my-3 border-slate-200" />
							<div id="service-categories"
								class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4 overflow-x-hidden">
							</div>
						</div>
					</div>
				</div>
			</div>
			<aside class="space-y-4 min-w-0">
				<section class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
					<div class="px-4 py-5 sm:px-5">
						<div class="flex items-center justify-between gap-3">
							<div>
								<h2 class="text-lg font-semibold text-slate-900">Calendar</h2>
								<!-- <p class="mt-1 text-sm text-slate-500">Stay on top of your schedule.</p> -->
							</div>
							<div class="flex items-center gap-2">
								<button id="calendar-prev-btn" type="button"
									class="calendar-nav-btn"
									aria-label="Previous month">
									<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
										<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
											 d="M15 19l-7-7 7-7"></path>
									</svg>
								</button>
								<button id="calendar-next-btn" type="button"
									class="calendar-nav-btn"
									aria-label="Next month">
									<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
										<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
											 d="M9 5l7 7-7 7"></path>
									</svg>
								</button>
							</div>
						</div>
						<div class="mt-4">
							<div id="calendar-month-label" class="text-center text-sm font-semibold text-slate-700"></div>
							<div id="calendar-weekdays"
								class="mt-3 grid grid-cols-7 gap-1 text-[10px] uppercase tracking-[0.24em] text-slate-400"></div>
							<div id="calendar-days" class="mt-2 grid grid-cols-7 gap-1"></div>
						</div>
					</div>
				</section>
				
				<section class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
					<div class="px-4 py-5 sm:px-5">
						<div class="flex items-start justify-between gap-3">
							<div>
								<h2 class="text-lg font-semibold text-slate-900">Todo</h2>
								<!-- <p class="text-sm text-slate-500 mt-1">Keep your important tasks in view.</p> -->
							</div>
						</div>
						<form id="todo-form" class="mt-5 grid gap-3 sm:grid-cols-[1fr_auto]">
							<label for="todo-input" class="sr-only">Add a task</label>
							<input id="todo-input" type="text" placeholder="Add a task"
								class="w-full rounded-full border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-slate-300" />
							<button type="submit"
								class="rounded-full bg-slate-900 px-5 py-3 text-sm font-semibold text-white transition hover:bg-slate-800">Add</button>
						</form>
						<div id="todo-empty" class="mt-6 text-sm text-slate-500">No tasks yet. Add something important.
						</div>
						<ul id="todo-list" class="mt-4 space-y-3"></ul>
					</div>
				</section>
			</aside>
		</div>

		<!-- Settings Modal -->
		<div id="settings-modal" class="settings-modal hidden">
			<div class="settings-modal-overlay"></div>
			<div class="settings-modal-content rounded-3xl border border-slate-200">
				<div class="flex items-center justify-between border-b border-slate-200 pb-4">
					<h2 class="text-lg font-semibold text-slate-900">Settings</h2>
					<button id="close-modal-btn" class="text-slate-400 hover:text-slate-600">
						<svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M6 18L18 6M6 6l12 12"></path>
						</svg>
					</button>
				</div>
				<div class="py-4">
					<label class="block text-sm font-medium text-slate-700 mb-3">Theme</label>
					<div id="theme-settings" class="flex flex-wrap gap-2">
						<button type="button" data-theme="system"
							class="theme-option px-4 py-2 rounded-full border border-slate-200 bg-slate-50 text-sm text-slate-700 hover:border-slate-300 transition-colors"
							aria-label="System theme">
							<span class="font-medium">System</span>
						</button>
						<button type="button" data-theme="light"
							class="theme-option px-4 py-2 rounded-full border border-slate-200 bg-slate-50 text-sm text-slate-700 hover:border-slate-300 transition-colors flex items-center gap-2"
							aria-label="Light theme">
							<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M12 3v1m0 16v1m9-9h-1m-16 0H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
								</path>
							</svg>
							<span class="font-medium">Light</span>
						</button>
						<button type="button" data-theme="dark"
							class="theme-option px-4 py-2 rounded-full border border-slate-200 bg-slate-50 text-sm text-slate-700 hover:border-slate-300 transition-colors flex items-center gap-2"
							aria-label="Dark theme">
							<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
								</path>
							</svg>
							<span class="font-medium">Dark</span>
						</button>
						<div class="settings-footer flex justify-end gap-3">
							<button id="reset-theme-btn" type="button"
								class="text-sm px-3 rounded-full bg-transparent border border-slate-200 text-slate-700 hover:bg-slate-100">Reset</button>
						</div>
					</div>
				</div>
				<div class="py-4">
					<label class="block text-sm font-medium text-slate-700 mb-3">Default Search Engine</label>
					<div id="modal-service-list" class="space-y-2 overflow-y-auto"></div>
				</div>
			</div>
		</div>

		<!-- Footer -->
		<footer class="mt-6 text-center text-xs text-slate-500">
			<p>&copy; 2026 Search Hub. All rights reserved.</p>
			<p class="mt-2">Developed by <a href="https://github.com/ncodevsec" target="_blank"
					rel="noopener noreferrer"
					class="text-slate-600 hover:text-slate-900 transition-colors font-medium">nCodevSec</a> • <a
					href="https://github.com/ncodevsec/search_hub" target="_blank" rel="noopener noreferrer"
					class="text-slate-600 hover:text-slate-900 transition-colors font-medium">GitHub</a></p>
		</footer>
	</main>

	<script src="searchEngineData.js"></script>
	<script src="script.js"></script>
</body>

</html>
